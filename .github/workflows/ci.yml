name: build-and-test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 取消同一分支上还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows: 完整构建 + 协议行为测试
  # (测试用 .cmd 假播放器替换真实播放器, 因此只在 Windows 上有意义)
  test:
    name: build + tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # -EnableJellyfinDlls: 用 NuGet 上的 Jellyfin 包, 不依赖 runner 上装了 Jellyfin。
      # 这一步同时完成构建与测试(测试工程引用插件工程)。
      - name: Build and run behaviour tests
        shell: pwsh
        run: ./plugin/tests/run-tests.ps1 -EnableJellyfinDlls

      # 注意: 仓库根目录没有项目文件, 必须指定 plugin 目录
      - name: Build plugin (Release)
        run: dotnet build plugin -c Release --nologo -p:EnableJellyfinDlls=true

      # 在 tag 上构建时额外产出发布资产(dll + meta.json + 校验和)。
      # 刻意由 CI 而不是本机打包: DLL 里带构建时的提交戳, 所以只有 CI 在 tag 上的构建
      # 才和 Actions 产物逐字节一致, 校验和才有意义。
      # -CopyDllToDist 让 dist\ 自成一套上传内容, 解压后就是三个文件, 没有嵌套目录。
      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./plugin/deploy/install.ps1 -Package -CopyDllToDist -EnableJellyfinDlls

      # 只上传 dist/*: 这样 artifact 解压出来就是三个文件, 不会多出
      # plugin/bin/Release/net9.0/ 这种目录层级(上传多个来源路径时 GitHub 会保留目录结构)。
      # 必须与打包步骤同为"仅 tag"条件: dist/ 只在打包时产生, 否则分支上这一步会因为找不到文件而失败。
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.PotPlayerLauncher
          path: dist/*
          if-no-files-found: error

      # 把校验和写进 Actions 摘要, 发布 Release 时直接复制
      - name: Show checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY

  # Linux: 只验证编译, 用来尽早发现宿主 API 变化 / 目标框架漂移。
  # 插件运行期依赖 Windows(桌面播放器 + Windows 路径), 所以这里不跑测试。
  build-linux:
    name: build (linux, compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build plugin
        run: dotnet build plugin -c Release --nologo -p:EnableJellyfinDlls=true
